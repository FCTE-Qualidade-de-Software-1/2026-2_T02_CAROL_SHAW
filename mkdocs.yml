site_name: Carol Shaw - Qualidade de Software (2026.2)
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_CAROL_SHAW/
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_CAROL_SHAW
repo_name: GitHub - Carol Shaw
edit_uri: edit/main/docs/

# Versão e data de atualização do site (aparece no rodapé de todas as páginas)

extra:
  version_actual: v1.0 - E1
  data_atualizacao: 26/10/2026
  release_e1: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_CAROL_SHAW/releases/tag/v1.0-E1
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_CAROL_SHAW
      name: Repositório da equipe Carol Shaw

theme:
  name: material
  font:
    text: Roboto
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: pt

  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo Claro
      primary: pink
      accent: pink
      background: "#f5f7fa"
      text: "#22272e"
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo Escuro
      primary: pink
      accent: pink
      background: "#22272e"
      text: "#f5f7fa"

markdown_extensions:
  - attr_list
  - tables
  - md_in_html
  - admonition
  - footnotes
  - toc:
      toc_depth: 3

# Rodapé exibido em todas as páginas (versão + data + links)
copyright: >
  Carol Shaw - Qualidade de Software (2026.2) |
  <a href="https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_CAROL_SHAW" target="_blank">Repositório</a> |
  <a href="https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_CAROL_SHAW/releases/tag/v1.0-E1" target="_blank">Release E1</a> |
  v1.0 - E1 | Atualizado em 26/10/2026

nav:
  - Início: index.md
  - Fase 1:
      - Introdução: fase1/introducao.md
      - Propósito da Avaliação: fase1/1-proposito.md
      - Requisitantes e Partes Interessadas: fase1/2-requisitantes.md
      - Descrição do Produto: fase1/3-descricao.md
      - Justificativas: fase1/4-justificativa.md
      - Modelo de Qualidade e Escopo: fase1/5-modelo.md
      - Tabela de Contribuição: fase1/6-tabela_de_contribuicao.md
      - Uso de Ferramentas de IA: fase1/7-uso_de_IA.md

  - Fase 2:
      - Introdução: fase2/introducao.md
      - Desdobramento GQM e Critérios de Julgamento: fase2/1-desdobramento.md
      - Representação Gráfica da Hierarquia GQM: fase2/2-representacao.md
